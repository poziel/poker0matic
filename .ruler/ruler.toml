# Ruler is the source of truth for AI coding-agent instructions.
# Edit markdown fragments in .ruler/ and run `npm run mcp` to regenerate outputs.
default_agents = ["agentsmd", "claude", "codex", "copilot", "trae"]

[gitignore]
enabled = true
local = false

[mcp_servers.vuetify]
url = "https://mcp.vuetifyjs.com/mcp"

# https://github.com/vuetifyjs/mcp#authentication
# [mcp_servers.vuetify.headers]
# Authorization = "Bearer <set with VUETIFY_MCP_API_KEY when needed>"
