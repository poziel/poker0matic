<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Poker0matic is a collaborative planning poker app for scrum teams to create rooms, join estimation sessions, vote on story points, and reveal results together."
    >
    <meta property="og:type" content="website">
    <meta
      property="og:title"
      content="Poker0matic | Planning poker for scrum teams"
    >
    <meta
      property="og:description"
      content="Create planning poker rooms, invite your team, vote in real time, and reveal story point estimates together."
    >
    <title>Poker0matic | Planning poker for scrum teams</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Restore path encoded by 404.html before Vue Router initialises.
      ;(function () {
        var p = new URLSearchParams(window.location.search).get('p')
        if (p != null) {
          var base = window.location.pathname.replace(/\/$/, '')
          window.history.replaceState(null, '', base + decodeURIComponent(p))
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
