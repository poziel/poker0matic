<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // Redirect to the SPA root, encoding the original path so index.html can restore it.
      var rest = window.location.pathname + window.location.search + window.location.hash
      window.location.replace(window.location.origin + '/?p=' + encodeURIComponent(rest))
    </script>
  </head>
  <body></body>
</html>
